[package]
name = "postpack-tools"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "mock-bam"
path = "src/bin/mock-bam.rs"

[[bin]]
name = "mock-rakurai"
path = "src/bin/mock-rakurai.rs"

[[bin]]
name = "mock-gravity"
path = "src/bin/mock-gravity.rs"

[[bin]]
name = "preconf-admin-mock"
path = "src/bin/preconf-admin-mock.rs"

[[bin]]
name = "fake-postpack-tx"
path = "src/bin/fake-postpack-tx.rs"

[dependencies]
agave-transaction-view = { version = "=4.2.1", features = ["agave-unstable-api"] }
anyhow = "1"
axum = "0.8.1"
base64 = "0.22.1"
bincode = "1.3"
bytes = "1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
prost = "0.14"
prost-types = "0.14"
reqwest = "0.13.4"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.134"
solana-compute-budget-interface = "3"
solana-hash = "=4.5.0"
solana-instruction = "3"
solana-keypair = "=3.1.2"
solana-message = "=4.4.1"
solana-pubkey = "=4.2.0"
solana-sdk = "4.0"
solana-signature = { version = "=3.4.1", features = ["verify"] }
solana-signer = "=3.0.1"
solana-system-interface = { version = "=3.2.0", features = ["bincode", "wincode"] }
solana-transaction = { version = "=4.1.6", features = ["wincode"] }
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["gzip", "tls-native-roots"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
wincode = "=0.5.5"

[build-dependencies]
tonic-prost-build = "0.14"

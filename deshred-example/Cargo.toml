[package]
name = "deshred-example"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
shreds-proto = { path = "../proto" }
tonic = "0.14"
prost-types = "0.14"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "signal", "time"] }
futures = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
bs58 = "0.5"
log = "0.4"
env_logger = "0.11"

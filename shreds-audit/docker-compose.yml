services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shred_audit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shred_audit"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana

  audit:
    profiles: ["audit"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Shutdown writes the windows still in progress; that can take up to a
    # minute while the last getBlock checks finish. Docker's default 10s would
    # SIGKILL it and lose them.
    stop_grace_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: host
    environment:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/shred_audit
    volumes:
      - ./config.yaml:/etc/shred-audit/config.yaml:ro

volumes:
  pgdata:
  grafana:

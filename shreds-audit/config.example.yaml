# shred-audit config. Copy to config.yaml and run: ./shred-audit --config config.yaml
#
# This is all you need to get started. Every other setting has a sensible
# default — see the "Optional" section at the bottom only if you want to tune.

# Mainnet RPC, used only to fetch the leader schedule (not on the hot path).
rpc_url: "https://api.mainnet-beta.solana.com"

# UDP ports shred-audit listens on. Give each provider one port and tell them
# to send there.
listen_ports: [20001, 20002]

# One entry per provider. Easiest setup: match by the port they send to.
providers:
  - name: alpha
    port: 20001
  - name: beta
    port: 20002

# ---------------------------------------------------------------------------
# DoubleZero Edge multicast
# ---------------------------------------------------------------------------
#
# To compare DoubleZero Edge against internet turbine on a validator, make each
# one a provider and add a `multicast` entry for the group port. shred-audit then
# receives the groups the same way raiku-agave does: it binds 0.0.0.0:7733 with
# SO_REUSEADDR and joins each group once its DoubleZero host route appears.
#
# SO_REUSEADDR is what makes this safe to run next to a live validator. The
# kernel fans a multicast datagram out to EVERY socket bound to the port, so
# shred-audit gets its own copy and the validator loses nothing. No mirroring,
# no extra hop: both legs are stamped by the kernel at driver handoff, so the
# turbine-vs-DoubleZero delta is an exact subtraction.
#
# listen_ports: [7733, 20001]
# providers:
#   - name: doublezero
#     port: 7733
#   - name: turbine
#     port: 20001
# multicast:
#   - port: 7733             # DoubleZero uses 7733 for every group (default)
#     cluster: mainnet       # mainnet | testnet -> that cluster's leader + root groups
#     # groups: ["233.84.178.1", "233.84.178.16"]   # or list them explicitly
#     # interface: "0.0.0.0"    # 0.0.0.0 lets the DoubleZero host route pick it
#     # require_route: true     # join only while a /32 host route to the group exists
#
# Turbine is the harder leg: agave owns the TVU port, so it cannot be bound
# twice. Mirror it to a spare port (`tc ... action mirred`) and point the
# `turbine` provider at that port.
#
# After a run, read `multicast` in manifest.json BEFORE comparing anything. A
# group that was not joined for the whole window did not lose races — it was in
# none of them, and `joined_ns` says for how long.
#
# ---------------------------------------------------------------------------
# Optional — uncomment and edit only if you need it. Defaults shown.
# ---------------------------------------------------------------------------
#
# bind_ip: "0.0.0.0"        # interface to bind (ignored for multicast ports,
#                           # which must bind 0.0.0.0 to receive their groups)
# output_dir: "./out"       # where archives are written
# rotate_secs: 600          # new archive every N secs (0 = one archive at exit)
# shred_version: null       # drop shreds not matching this version (null = all)
#
# Match a provider by source IP instead of / in addition to port:
# providers:
#   - name: gamma
#     ips: ["203.0.113.7"]
#
# Compare shred delivery against Geyser/Yellowstone gRPC feeds by transaction
# arrival time:
# grpc_sources:
#   - name: regular-geyser
#     url: "https://grpc.example.com:443"
#     x_token: "optional-auth-token"
#     mode: transactions      # default when omitted
#     commitment: processed   # processed | confirmed | finalized
#   - name: early-deshred
#     url: "https://deshred.example.com:443"
#     x_token: "optional-auth-token"
#     mode: deshred           # pre-execution; commitment is not supported
#
# Onchain audit of the transaction comparison above. Every few seconds it samples
# one recent slot, fetches that block's signatures with getBlock, and counts what
# each source missed, invented, or repeated. On by default whenever grpc_sources is
# set, and inert without it.
#
# Each sample is one getBlock call. A public endpoint will rate-limit it — give it
# your own node or raise onchain_sample_secs, or you will audit far fewer slots
# than the run length suggests (shows up as `onchain_rpc_errors` in the manifest).
#
# onchain_verify: true
# onchain_sample_secs: 5    # seconds between sampled slots (one getBlock each)
# onchain_rpc_url: "http://your-node:8899"   # defaults to rpc_url
# onchain_lag_slots: 32     # how far behind the tip to sample (~13s); minimum 8

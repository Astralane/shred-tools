rpc:
  provider: generic
  url: "https://api.mainnet-beta.solana.com"

bind_ip: "0.0.0.0"
listen_ports: [20001, 20002]

providers:
  - name: alpha
    port: 20001
  - name: beta
    port: 20002
  - name: gamma
    ips: ["203.0.113.7"]

output_dir: "./out"
rotate_secs: 600
export:
  mode: zip
  postgres:
    url: "postgres://audit:audit@127.0.0.1:5432/shredaudit"
    flush_secs: 15

verify_threads: 0
fec_max_wait_slots: 10
shred_version: null
live_secs: 10
ping_secs: 30

grpc_sources:
  - name: regular-geyser
    url: "https://grpc.example.com:443"
    x_token: "optional-auth-token"
    mode: transactions
    commitment: processed
    rotate: true
  - name: early-deshred
    url: "https://deshred.example.com:443"
    x_token: "optional-auth-token"
    mode: deshred
    rotate: true
  - name: deshred-baseline
    url: "https://deshred.example.com:443"
    mode: deshred
    rotate: false

filter_rotation:
  enabled: true
  min_secs: 30
  max_secs: 60
  sample_every_slots: 10

onchain_verify: true
onchain_sample_secs: 5
onchain_lag_slots: 32

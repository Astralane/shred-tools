[package]
name = "shred-audit"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Receive Solana shreds from multiple providers, verify every shred's signature against the slot leader, timestamp arrival with nanosecond precision, and emit a signed Parquet report."

[dependencies]
solana-ledger = { git = "https://github.com/nuel77/agave", branch = "feat/v4.3.0-shred-recover", features = ["agave-unstable-api"] }
solana-sdk = "3.0.0"

ed25519-dalek = { version = "2", features = ["batch"] }
rayon = "1"
crossbeam-channel = "0.5"
libc = "0.2"
ahash = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
ureq = { version = "2", features = ["json"] }
bs58 = "0.5"
ctrlc = "3"
chrono = "0.4"
hdrhistogram = "7.5"

# Re-exports crossterm; no separate pin to drift.
ratatui = "0.29"

postgres = "0.19"

zip = { version = "2", default-features = false, features = ["deflate"] }
parquet = { version = "55", features = ["arrow", "zstd"] }
arrow-array = "55"
arrow-schema = "55"

deshred = { path = "../deshred" }

tokio = { version = "1.40", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

shreds-proto = { path = "../proto" }
tonic = { version = "~0.14.2", features = ["tls-native-roots"] }
tonic-prost = "~0.14.0"
prost = "0.14"
prost-types = "0.14"
bytes = "1"
futures = "0.3"

[dev-dependencies]
# Same fork pin as the runtime dep so the test shreds' wire format is identical.
solana-ledger = { git = "https://github.com/nuel77/agave", branch = "feat/v4.3.0-shred-recover", features = [
    "agave-unstable-api",
    "dev-context-only-utils",
] }
solana-entry = { git = "https://github.com/nuel77/agave", branch = "feat/v4.3.0-shred-recover", features = ["agave-unstable-api"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[patch.crates-io]
crossbeam-epoch = { git = "https://github.com/anza-xyz/crossbeam", rev = "5ee1c6ec671d94db14ed9238eb99e59a84555aad" }
librocksdb-sys = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
rocksdb = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }

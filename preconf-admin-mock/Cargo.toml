[package]
name = "preconf-admin-mock"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
agave-transaction-view = { version = "=4.2.1", features = ["agave-unstable-api"] }
axum = "0.8.1"
base64 = "0.22.1"
reqwest = "0.13.4"
chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.134"
solana-message = "=4.4.1"
solana-pubkey = "=4.2.0"
solana-signature = { version = "=3.4.1", features = ["verify"] }
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

[dev-dependencies]
solana-hash = "=4.5.0"
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
solana-system-interface = { version = "=3.2.0", features = ["wincode"] }
solana-transaction = { version = "=4.1.6", features = ["wincode"] }
wincode = "=0.5.5"

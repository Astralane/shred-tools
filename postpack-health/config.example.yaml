# postpack-health config. Copy to config.yaml and run:
#   ./postpack-health --config-path config.yaml

# ClickHouse holding shred_indexer.*. Must be the cluster the indexer writes to
# (new-longhorn), because relay_arrivals, tx_shreds and fec_arrivals are joined
# locally.
clickhouse:
  url: "http://new-longhorn:18123/"
  user: "astralane-quant"
  password: ""
  database: "shred_indexer"

# Incoming webhook for the channel that should receive degradation alerts.
slack_webhook: "https://hooks.slack.com/services/..."

# Which indexer host to measure. Both sides of the race are stamped by this
# host's clock, so the comparison is free of skew. Omit to use every host.
shred_host: "longhorn-lt"

# Postpack endpoints the indexer subscribes to. Omit for all of them.
endpoints:
  - "185.191.117.97:30001"

# ---------------------------------------------------------------------------
# Optional — defaults shown.
# ---------------------------------------------------------------------------
#
# poll_interval_secs: 60      # how often to evaluate
# window_secs: 900            # width of the evaluated window
# window_offset_secs: 300     # how far behind now the window ends, so that
#                             # transactions have had time to land
# land_lookahead_secs: 120    # how far past the window to look for the shred
#                             # range carrying a transaction
# min_pairs: 100              # below this many matched pairs the verdict is
#                             # withheld rather than drawn from a few samples
# win_rate_threshold: 0.85    # breach below this share of postpack-first txns
# recovery_win_rate: 0.90     # recovery is announced at or above this
# late_ms_threshold: 100      # a transaction this far behind shreds is "late"
# late_rate_threshold: 0.10   # breach above this share of late transactions
# repeat_alert_secs: 900      # while degraded, repeat at most this often
# no_data_alert_after_secs: 1800  # alert if the window stays empty this long
# query_timeout_secs: 60

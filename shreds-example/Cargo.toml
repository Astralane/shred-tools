[package]
name = "shreds-example"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "shreds-example"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.18", features = ["derive", "env"] }
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "sync", "signal", "time"] }
anyhow = "1.0.99"
log = "0.4.27"
env_logger = "0.11.8"

reqwest = { version = "0.13.4", features = ["json"] }
serde_json = "1.0.134"

solana-sdk = "4.0.0"
solana-client = { git = "https://github.com/nuel77/agave", branch = "feat/v4.3.0-shred-recover" }
solana-commitment-config = "3.1.1"
solana-compute-budget-interface = "3.1.0"
solana-system-interface = "3.3.0"
bincode = "1.3.3"
base64 = "0.22.1"

solana-ledger = { git = "https://github.com/nuel77/agave", branch = "feat/v4.3.0-shred-recover", features = ["agave-unstable-api"] }
solana-entry = { git = "https://github.com/nuel77/agave", branch = "feat/v4.3.0-shred-recover", features = ["agave-unstable-api"] }
wincode = "0.6.1"

[patch.crates-io]
librocksdb-sys = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
rocksdb = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }

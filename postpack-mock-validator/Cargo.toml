[package]
name = "postpack-mock-validator"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "postpack-mock-validator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bincode = "1.3"
bytes = "1"
clap = { version = "4", features = ["derive"] }
prost = "0.14"
prost-types = "0.14"
solana-keypair = "3.1"
solana-pubkey = "4.2"
solana-sdk = "4.0"
solana-signer = "3.0"
solana-system-interface = { version = "2.0", features = ["bincode"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["gzip", "tls-native-roots"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14"
